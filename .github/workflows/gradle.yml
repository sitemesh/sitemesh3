name: Build and Publish SiteMesh

on:
  push:
    tags:
      - '*'    # tag pushes will run the "release" flow
    branches:
      - '**'   # branch pushes will run the snapshot flow
  workflow_dispatch: # allow the Release workflow to dispatch this on a new tag

jobs:
  build-gradle-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project sources
        uses: actions/checkout@v3

      - name: Set up JDK 17 with cache
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Run tests
        run: ./gradlew --no-daemon clean test

  # The job above tests on JDK 17; these run alongside it. Only the publish job at the end
  # publishes, once all of them have passed.

  # Run the tests on newer JDKs too; the code is still compiled for 17.
  test-newer-jdks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4

      - name: Set up JDK 17 and ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            ${{ matrix.java }}
            17
          cache: 'gradle'

      - name: Run tests on JDK ${{ matrix.java }}
        # fromEnv points Gradle's toolchain lookup at the JDKs set up above.
        run: >-
          ./gradlew --no-daemon test -PtestJavaVersion=${{ matrix.java }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_${{ matrix.java }}_X64

  # The default test run covers the Spring Boot example on Tomcat only.
  springboot-jetty:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Run Spring Boot example tests on Jetty
        run: ./gradlew --no-daemon :examples:springboot:test -Pcontainer=jetty

  # Boots every example on Tomcat and Jetty and checks that pages come back decorated.
  examples-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make sure lsof is available
        run: command -v lsof || (sudo apt-get update && sudo apt-get install -y lsof)

      - name: Smoke-test the examples
        run: examples/smoke-test.sh

      - name: Upload smoke-test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: build/smoke-test/

  # Snapshot (branch push) or release (tag push) publishing, only once every test job passed.
  publish:
    needs: [ build-gradle-project, test-newer-jdks, springboot-jetty, examples-smoke-test ]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release for a tag

    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the release notes start from the previous tag

      - name: Set up JDK 17 with cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Restore gradle.properties
        env:
          GRADLE_PROPERTIES: ${{ secrets.GRADLE_PROPERTIES }}
        shell: bash
        run: |
          mkdir -p ~/.gradle/
          echo "${GRADLE_PROPERTIES}" > ~/.gradle/gradle.properties

      # Snapshot flow (any non-tag push)
      - name: Publish SNAPSHOT to Central
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew --no-daemon publishToSonatype

      # Release flow (tag push)
      - name: Close and Release to Central
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew --no-daemon publishToSonatype closeAndReleaseSonatypeStagingRepository

      # Once the artifacts are released, give the tag a GitHub release with notes generated
      # from the previous tag; edit them on GitHub afterwards. A release made by hand first
      # is left alone.
      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "A GitHub release for $TAG already exists; leaving it alone."
            exit 0
          fi
          flags=(--verify-tag --title "$TAG" --generate-notes)
          if previous=$(git describe --tags --abbrev=0 "$TAG^" 2> /dev/null); then
            flags+=(--notes-start-tag "$previous")
          fi
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          else
            # Only a release newer than the current latest becomes Latest, so a 3.2.x patch
            # released after 3.3.0 does not take its place.
            latest=$(gh release view --json tagName --jq .tagName 2> /dev/null || true)
            if [ -z "$latest" ] || [ "$(printf '%s\n' "$latest" "$TAG" | sort -V | tail -n 1)" = "$TAG" ]; then
              flags+=(--latest)
            else
              flags+=(--latest=false)
            fi
          fi
          gh release create "$TAG" "${flags[@]}"
